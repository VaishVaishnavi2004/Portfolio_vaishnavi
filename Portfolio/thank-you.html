<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vaishnavi Gupta | Business Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="/src/style.css" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    <style>
      * {
        font-family: "Inter", sans-serif;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-16px);
        }
      }
      @keyframes float-slow {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(6deg);
        }
      }
      @keyframes pop-in {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        60% {
          transform: scale(1.08);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes draw-check {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes fade-up {
        0% {
          opacity: 0;
          transform: translateY(14px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .blob-1 {
        animation: float 7s ease-in-out infinite;
      }
      .blob-2 {
        animation: float-slow 9s ease-in-out infinite;
      }
      .blob-3 {
        animation: float 8s ease-in-out infinite reverse;
      }

      .check-circle {
        animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
      }
      .check-path {
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        animation: draw-check 0.5s ease-out 0.5s forwards;
      }

      .fade-up-1 {
        animation: fade-up 0.6s ease-out 0.7s both;
      }
      .fade-up-2 {
        animation: fade-up 0.6s ease-out 0.85s both;
      }
      .fade-up-3 {
        animation: fade-up 0.6s ease-out 1s both;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-pink-50 relative overflow-hidden flex items-center justify-center px-6"
  >
    <!-- Background blobs -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div
        class="blob-1 absolute -top-24 -left-24 w-80 h-80 rounded-full bg-fuchsia-300/40 blur-3xl"
      ></div>
      <div
        class="blob-2 absolute top-1/3 -right-32 w-96 h-96 rounded-full bg-pink-300/40 blur-3xl"
      ></div>
      <div
        class="blob-3 absolute -bottom-32 left-1/4 w-96 h-96 rounded-full bg-rose-300/40 blur-3xl"
      ></div>
    </div>

    <!-- Card -->
    <div
      class="relative z-10 w-full max-w-lg rounded-3xl border border-slate-100 bg-white/70 backdrop-blur-xl shadow-2xl p-10 sm:p-14 text-center"
    >
      <!-- Success icon -->
      <div
        class="check-circle mx-auto w-20 h-20 rounded-full bg-linear-to-br from-fuchsia-500 via-pink-500 to-rose-400 flex items-center justify-center shadow-lg shadow-fuchsia-300/50"
      >
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path
            class="check-path"
            d="M4 12.5L9.5 18L20 6"
            stroke="fuchsia"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <span
        class="fade-up-1 mt-6 inline-block text-xs font-semibold tracking-widest uppercase text-fuchsia-600"
        >Message Sent</span
      >

      <h1 class="fade-up-2 mt-3 text-2xl sm:text-3xl font-bold text-slate-900">
        Thank you for reaching out!
      </h1>

      <p
        class="fade-up-2 mt-4 text-sm sm:text-base text-slate-600 leading-relaxed max-w-sm mx-auto"
      >
        I've received your message and truly appreciate you taking the time to
        connect. I usually respond within a day — talk soon!
      </p>

      <div
        class="fade-up-3 mt-8 flex flex-col sm:flex-row items-center justify-center gap-3"
      >
        <a
          href="/"
          class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 text-white text-sm font-semibold px-6 py-3 hover:bg-slate-800 transition-colors"
        >
          <iconify-icon icon="mdi:arrow-left" class="text-base"></iconify-icon>
          Back to Home
        </a>
        <a
          href="/#projects"
          class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white/60 text-slate-700 text-sm font-semibold px-6 py-3 hover:bg-white transition-colors"
        >
          View My Work
          <iconify-icon icon="mdi:arrow-right" class="text-base"></iconify-icon>
        </a>
      </div>

      <p class="fade-up-3 mt-8 text-xs text-slate-400">
        In the meantime, feel free to connect on
        <a href="#" class="text-fuchsia-600 font-medium hover:underline"
          >LinkedIn</a
        >
        or
        <a href="#" class="text-fuchsia-600 font-medium hover:underline"
          >GitHub</a
        >.
      </p>
    </div>
  </body>
</html>
